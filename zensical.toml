[project]
site_name = "ifood-sdk"
site_url = "https://felipeadeildo.github.io/ifood-sdk"
repo_url = "https://github.com/felipeadeildo/ifood-sdk"
repo_name = "felipeadeildo/ifood-sdk"
edit_uri = "edit/main/docs/"
site_description = "Unofficial toolkit for the iFood consumer API"
site_author = "ifood-sdk"
copyright = "Unofficial project. Not affiliated with iFood."

extra_css = [
  "stylesheets/extra.css",
]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
      "guides/install.md",
      "guides/quickstart.md",
      "guides/login.md",
      "guides/addresses.md",
      "guides/orders.md",
      "guides/cart.md",
      "guides/mcp.md",
      "guides/api.md",
  ] },
  { "Reference" = [
      "reference/client.md",
      "reference/endpoints.md",
      "reference/errors.md",
      "reference/limits.md",
  ] },
  { "Project" = [
      "architecture.md",
      "roadmap.md",
      "disclaimer.md",
  ] },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = ["navigation.sections", "navigation.top", "content.code.copy"]

# Light
[[project.theme.palette]]
scheme = "default"
primary = "green"
accent = "green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Dark
[[project.theme.palette]]
scheme = "slate"
primary = "green"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"


[project.theme.icon]
repo = "fontawesome/brands/github"
