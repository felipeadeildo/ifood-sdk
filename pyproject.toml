[project]
name = "ifood-sdk"
version = "0.1.0"
description = "Unofficial Python client for the iFood consumer API"
requires-python = ">=3.14"
dependencies = ["httpx", "pydantic", "pydantic-settings"]

[project.optional-dependencies]
mcp = ["mcp"]
api = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["ruff", "ty", "pytest", "zensical", "prek"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifood"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["research"]

[tool.ruff.format]
# Docs carry hand-aligned examples; the formatter would reflow them.
exclude = ["docs/**", "README.md", "research/**", "site/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF", "ANN", "S", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN", "E501", "RUF001", "RUF002", "RUF036", "SIM105", "T20"]
# Constant names that mention tokens, not secrets: an env var name and two URL paths.
"src/ifood/api/app.py" = ["S105"]
"src/ifood/mcp/asgi.py" = ["S105"]
"src/ifood/wire/endpoints.py" = ["S105"]

[tool.ty.src]
exclude = ["research", "tests"]

[tool.ty.rules]
possibly-missing-import = "warn"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
markers = [
    "live: talks to the real API (needs a session jar)",
    "session: needs a saved session on disk",
    "manual: a human has to run it",
]
