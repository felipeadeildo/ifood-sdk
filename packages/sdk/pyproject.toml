[project]
name = "ifood-sdk"
version = "0.1.0"
description = "Unofficial Python SDK for the iFood consumer API"
requires-python = ">=3.14"
dependencies = ["httpx", "pydantic", "pydantic-settings"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifood"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Os testes carregam texto em português e tabelas de exemplo: largura e unicode ficam livres.
"tests/**" = ["ANN", "E501", "RUF001", "RUF002", "RUF036", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
markers = [
    "live: talks to the real API (needs a session jar)",
    "session: per-endpoint smoke with the operator cookie jar (--live --jar)",
    "manual: step that needs a human (OTP), never runs alone",
]
