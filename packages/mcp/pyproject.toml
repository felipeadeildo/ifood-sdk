[project]
name = "ifood-mcp"
version = "0.1.0"
description = "MCP server for the iFood consumer API"
requires-python = ">=3.14"
dependencies = ["ifood-sdk", "mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifood_mcp"]
